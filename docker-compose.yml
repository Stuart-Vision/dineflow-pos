services:
  # --------------------------------------------------------------------------
  # MongoDB configured as a single-node replica set.
  # The replica set is not for redundancy here — it is what makes multi-document
  # transactions available, which the order/payment/inventory flows rely on.
  # --------------------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: dineflow-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      # Host port 27018 keeps DineFlow clear of any MongoDB already bound to
      # the default 27017 on the developer machine.
      - '${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok
          }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # --------------------------------------------------------------------------
  # Application. Only started with the `app` profile so that `npm run db:up`
  # (plain `docker compose up -d mongo`) stays fast for local development.
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineflow-app
    profiles: ['app']
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/dineflow?replicaSet=rs0&directConnection=true
      # Must be provided via .env or the shell before running the `app` profile.
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: ${NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS:-true}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
